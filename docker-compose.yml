services:
  api:
    build: .
    image: pinterest-api:latest
    container_name: pinterest-api
    restart: unless-stopped
    ports:
      - "${PORT:-9000}:9000"
    env_file:
      - .env
    environment:
      PORT: 9000
      API_KEY: ${API_KEY:-sex}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-60}
      USER_AGENT: ${USER_AGENT:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pinnet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: pinterest-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - pinnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pinnet:
    driver: bridge
